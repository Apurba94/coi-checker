[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coi-checker"
version = "0.1.0"
description = "Detect potential reviewer conflicts of interest from co-authorship records."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
coi-checker = "coi_checker.cli:main"

[tool.setuptools]
packages = ["coi_checker"]
